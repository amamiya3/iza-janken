<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10120f"><title>葬手｜天秤の動き試作</title><style>
*{box-sizing:border-box}body{margin:0;color:#d9ddd2;background:#0c0f0c;font-family:serif}main{max-width:540px;margin:auto;padding:24px 18px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;background:radial-gradient(ellipse at 50% 35%,#30372b66,transparent 65%)}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a5ad99}a{color:inherit}h1{text-align:center;letter-spacing:.3em;font-weight:400;margin:28px 0 4px}p{text-align:center;color:#aeb69f;font-size:12px;line-height:1.7}.score{display:flex;justify-content:space-around;margin:24px 0 0;font-size:13px;letter-spacing:.15em}.score strong{display:block;font-size:34px;text-align:center;font-weight:400;color:#d4dfb2}.stage{position:relative}svg{display:block;width:100%;height:auto;overflow:visible}.beam{will-change:transform}.light{opacity:0;will-change:transform,opacity;fill:#e0f0a9;filter:drop-shadow(0 0 6px #cde58e)}.ring{fill:none;stroke:#d1e49a;stroke-width:2;opacity:0}#message{min-height:40px;margin:2px 0 12px;color:#ced9b4;font-size:14px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button{touch-action:manipulation;min-height:52px;border:1px solid #707865;color:#dce0d3;background:linear-gradient(145deg,#30362c,#141812);font:inherit;border-radius:3px}button:active{background:#414b34}button:focus-visible{outline:2px solid #d6e69d;outline-offset:3px}.controls button:first-child{border-color:#b5c58d}button:disabled{opacity:.45}footer{display:flex;justify-content:space-between;align-items:center;margin:18px 0;gap:12px}footer button{min-height:44px;padding:6px 16px}label{font-size:12px;color:#b7beab}input{accent-color:#c1d58e;vertical-align:middle}#fps{font:11px monospace;text-align:center;color:#8b9680;margin:20px 0 0}.note{font-size:11px;color:#858f7b} .reduced{display:none}@media(prefers-reduced-motion:reduce){.reduced{display:block}}
</style><main><header><a href="../index.html">← ホーム</a><span>動きの試作 01</span></header><h1>葬手</h1><p>LAST HAND · THE BALANCE</p><div class="score"><div>YOU<strong id="you">0</strong></div><div>RIVAL<strong id="rival">0</strong></div></div><div class="stage"><svg viewBox="0 0 500 400" role="img" aria-label="得点差に応じて傾く魂の天秤"><defs><linearGradient id="silver"><stop stop-color="#5e6858"/><stop offset=".45" stop-color="#c7cdbd"/><stop offset=".6" stop-color="#747e68"/><stop offset="1" stop-color="#343b30"/></linearGradient><radialGradient id="halo"><stop stop-color="#c6df8a" stop-opacity=".15"/><stop offset="1" stop-color="#c6df8a" stop-opacity="0"/></radialGradient></defs><circle cx="250" cy="205" r="190" fill="url(#halo)"/><path d="M250 55L260 78 255 321 295 340 305 351H195L205 340 245 321 240 78Z" fill="url(#silver)" stroke="#87917a"/><path d="M180 357H320L334 369H166Z" fill="#252c22" stroke="#77836a"/><circle cx="250" cy="90" r="17" fill="#151c12" stroke="#aebc97"/><path d="M250 78L254 86 262 90 254 94 250 103 246 94 238 90 246 86Z" fill="#bccd98"/>
<g id="beam" class="beam"><path d="M70 124Q130 128 200 116Q230 113 250 126Q270 113 300 116Q370 128 430 124L428 138Q360 146 298 131Q270 126 250 140Q230 126 202 131Q140 146 72 138Z" fill="url(#silver)" stroke="#a0ab90"/><circle cx="250" cy="130" r="11" fill="#161d12" stroke="#c2cfaa"/></g>
<g id="left"><g id="leftSwing"><path d="M-48 149L0 0 48 149M0 0V151" stroke="#9aa789" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M-63 149Q0 211 63 149Z" fill="#293422" stroke="#b1c28f" stroke-width="2"/><path d="M-53 155Q0 176 53 155" fill="none" stroke="#62774c"/><ellipse id="leftGlow" cx="0" cy="158" rx="46" ry="9" fill="#cde890" opacity=".08"/></g></g>
<g id="right"><g id="rightSwing"><path d="M-48 149L0 0 48 149M0 0V151" stroke="#9aa789" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M-63 149Q0 211 63 149Z" fill="#293422" stroke="#b1c28f" stroke-width="2"/><path d="M-53 155Q0 176 53 155" fill="none" stroke="#62774c"/><ellipse id="rightGlow" cx="0" cy="158" rx="46" ry="9" fill="#cde890" opacity=".08"/></g></g><circle id="soul" class="light" r="5"/><ellipse id="ripple" class="ring" rx="30" ry="6"/></svg></div><p id="message" role="status" aria-live="polite">勝ち・負けを押して、動きを確かめてください</p><div class="controls"><button id="win">勝ち</button><button id="lose">負け</button><button id="draw">あいこ</button></div><footer><label>余韻 <input id="damping" type="range" min="8" max="17" value="11" aria-label="揺れの収まりの速さ"></label><button id="reset">リセット</button></footer><p class="reduced">端末の「視差効果を減らす」に合わせて動きを控えています。</p><p class="note">操作感を見る簡易素材の試作です。得点差が傾きになり、勝者側が沈みます。<br>対戦接続・カード消費・戦績保存は行いません。</p><p id="fps">計測準備中</p></main><script>
'use strict';const $=id=>document.getElementById(id);let wins=0,losses=0,angle=0,velocity=0,target=0,last=0,impact=null,pending=null,frames=[],finished=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function endpoints(a){const r=a*Math.PI/180;return {left:{x:250-178*Math.cos(r),y:130-178*Math.sin(r)},right:{x:250+178*Math.cos(r),y:130+178*Math.sin(r)}}}
function step(a,v,t,dt,damping){const acc=82*(t-a)-damping*v;v+=acc*dt;a+=v*dt;return [a,v]}
function controls(disabled){for(const id of ['win','lose','draw'])$(id).disabled=disabled}
function outcome(kind){if(pending||finished)return;controls(true);const now=performance.now();if(kind==='draw'){velocity+=reduce?2:24;$('message').textContent='あいこ。天秤は元の傾きへ戻る';pending={kind,time:now+750};return}const side=kind==='win'?'left':'right';$('message').textContent='魂が、'+(side==='left'?'あなた':'相手')+'の皿へ落ちる';pending={kind,side,time:now+(reduce?100:620),start:now};}
$('win').onclick=()=>outcome('win');$('lose').onclick=()=>outcome('lose');$('draw').onclick=()=>outcome('draw');$('reset').onclick=()=>{wins=losses=0;target=0;pending=impact=null;finished=false;$('you').textContent=$('rival').textContent='0';$('message').textContent='もう一度、動きを確かめてください';controls(false)};
function loop(now){if(document.hidden){last=0;requestAnimationFrame(loop);return}const dt=last?Math.min((now-last)/1000,.04):1/60;if(last){frames.push(now-last);if(frames.length>90)frames.shift()}last=now;let p=endpoints(angle);$('soul').style.opacity=0;if(pending&&pending.side){const u=Math.min(1,(now-pending.start)/(pending.time-pending.start)),dest=p[pending.side];$('soul').setAttribute('cx',dest.x+Math.sin(u*Math.PI)*13);$('soul').setAttribute('cy',dest.y-80+u*u*238);$('soul').style.opacity=reduce?0:Math.sin(u*Math.PI/2)}
if(pending&&now>=pending.time){if(pending.kind!=='draw'){pending.kind==='win'?wins++:losses++;$('you').textContent=wins;$('rival').textContent=losses;target=Math.max(-19,Math.min(19,(losses-wins)*6.3));impact={side:pending.side,start:now};velocity+=(pending.side==='left'?-1:1)*(reduce?2:13);finished=wins>=3||losses>=3;$('message').textContent=finished?(wins>=3?'あなたの勝利。魂の重みで決着':'相手の勝利。魂の重みで決着'):'得点差 '+Math.abs(wins-losses)+'。揺れが静まるのを見てください'}pending=null;if(!finished)controls(false)}
let remaining=dt;while(remaining>0){const h=Math.min(remaining,1/240);[angle,velocity]=step(angle,velocity,target,h,reduce?22:Number($('damping').value));remaining-=h}
p=endpoints(angle);$('beam').setAttribute('transform','rotate('+angle+' 250 130)');for(const side of ['left','right']){$(side).setAttribute('transform','translate('+p[side].x+' '+p[side].y+')');const sway=reduce?0:Math.max(-5,Math.min(5,-velocity*.12));$(side+'Swing').setAttribute('transform','rotate('+sway+')');$(side+'Glow').setAttribute('opacity',.08+Math.min(.65,(side==='left'?wins:losses)*.18))}if(impact){const t=(now-impact.start)/1000,at=p[impact.side];$('ripple').setAttribute('transform','translate('+at.x+' '+(at.y+158)+') scale('+(1+t*1.4)+')');$('ripple').style.opacity=reduce?0:Math.max(0,.8-t)}else $('ripple').style.opacity=0;if(frames.length>15){const mean=frames.reduce((a,b)=>a+b,0)/frames.length;$('fps').textContent='描画 約'+Math.round(1000/mean)+' fps · '+mean.toFixed(1)+' ms / frame'}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
